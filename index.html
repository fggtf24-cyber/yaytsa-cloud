<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>Яйца Cloud — все приложения</title>
<meta name="description" content="Бесплатные программы для Windows: Smooth Cursor, VoiceType, Яйцечист, Яйца Таймер и другие.">
<script>try { document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark'; } catch { /* приватный режим: тёмная */ }</script>
<link rel="icon" href="assets/favicon.svg?v=3" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=75">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <clipPath id="ycT"><rect width="40" height="40" rx="10"/></clipPath>
    <radialGradient id="ycR" gradientUnits="userSpaceOnUse" cx="21" cy="-4" r="21"><stop offset="0" stop-color="#FF0A0A"/><stop offset="1" stop-color="#FF0A0A" stop-opacity="0"/></radialGradient>
    <radialGradient id="ycO" gradientUnits="userSpaceOnUse" cx="44" cy="8" r="22"><stop offset="0" stop-color="#FF4E00"/><stop offset="1" stop-color="#FF4E00" stop-opacity="0"/></radialGradient>
    <radialGradient id="ycY" gradientUnits="userSpaceOnUse" cx="44" cy="31" r="17"><stop offset="0" stop-color="#FFCF12"/><stop offset="1" stop-color="#FFCF12" stop-opacity="0"/></radialGradient>
    <radialGradient id="ycG" gradientUnits="userSpaceOnUse" cx="42" cy="46" r="27"><stop offset="0" stop-color="#3EE04E"/><stop offset="1" stop-color="#3EE04E" stop-opacity="0"/></radialGradient>
    <radialGradient id="ycB" gradientUnits="userSpaceOnUse" cx="-4" cy="44" r="34"><stop offset="0" stop-color="#2E86FF"/><stop offset="1" stop-color="#2E86FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="ycP" gradientUnits="userSpaceOnUse" cx="-4" cy="26" r="18"><stop offset="0" stop-color="#A04CFF"/><stop offset="1" stop-color="#A04CFF" stop-opacity="0"/></radialGradient>
    <radialGradient id="ycM" gradientUnits="userSpaceOnUse" cx="-4" cy="9" r="20"><stop offset="0" stop-color="#FF1FB0"/><stop offset="1" stop-color="#FF1FB0" stop-opacity="0"/></radialGradient>
    <linearGradient id="ycBand" gradientUnits="userSpaceOnUse" x1="6" y1="12" x2="32" y2="34"><stop offset="0" stop-color="#E54CFF"/><stop offset=".45" stop-color="#FF6A4A"/><stop offset="1" stop-color="#FFC21A"/></linearGradient>
    <symbol id="logo" viewBox="0 0 40 40">
      <g clip-path="url(#ycT)">
        <rect width="40" height="40" fill="#EC3D7A"/>
        <rect width="40" height="40" fill="url(#ycR)"/><rect width="40" height="40" fill="url(#ycM)"/>
        <rect width="40" height="40" fill="url(#ycO)"/><rect width="40" height="40" fill="url(#ycP)"/>
        <rect width="40" height="40" fill="url(#ycY)"/><rect width="40" height="40" fill="url(#ycG)"/>
        <rect width="40" height="40" fill="url(#ycB)"/>
      </g>
      <g stroke-linejoin="round">
        <path d="M25.60 8.60C21.95 8.60 18.65 14.18 18.65 18.74c0.00 4.33 3.08 7.87 6.95 7.87s6.95 -3.53 6.95 -7.87C32.55 14.18 29.25 8.60 25.60 8.60z" fill="url(#ycBand)" stroke="#fff" stroke-width="2"/>
        <path d="M25.60 13.61C23.56 13.61 21.71 16.74 21.71 19.29c0.00 2.43 1.72 4.40 3.89 4.40s3.89 -1.98 3.89 -4.40C29.49 16.74 27.64 13.61 25.60 13.61z" fill="#fff"/>
        <path d="M15.20 11.22C10.59 11.22 6.42 18.27 6.42 24.03c0.00 5.47 3.89 9.94 8.78 9.94s8.78 -4.46 8.78 -9.94C23.98 18.27 19.81 11.22 15.20 11.22z" fill="url(#ycBand)" stroke="#fff" stroke-width="2"/>
        <path d="M15.20 17.56C12.62 17.56 10.28 21.52 10.28 24.74c0.00 3.06 2.18 5.56 4.92 5.56s4.92 -2.50 4.92 -5.56C20.12 21.52 17.78 17.56 15.20 17.56z" fill="#fff"/>
      </g>
    </symbol>
  </defs>
</svg>

<header class="top">
  <a class="brand" href="#apps" data-t-label="Яйца Cloud — на главную" aria-label="Яйца Cloud — на главную">
    <svg width="34" height="34" aria-hidden="true"><use href="#logo"/></svg>
    <span data-t="Яйца Cloud">Яйца Cloud</span>
  </a>
  <nav class="top-nav" data-t-label="Разделы" aria-label="Разделы"><a href="#apps" data-t="Творчество и дизайн">Творчество и дизайн</a></nav>
  <div class="top-right">
    <div class="search-wrap">
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#BDBDBD" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <span class="sr" data-t="Поиск программ и @людей">Поиск программ и @людей</span>
        <input id="search" type="search" autocomplete="off" data-t-placeholder="Поиск программ и @людей" placeholder="Поиск программ и @людей">
      </label>
      <div id="search-panel" class="pop search-panel" hidden></div>
    </div>
    <div id="bell-wrap" class="bell-wrap" hidden>
      <button type="button" id="bell" class="bell" aria-label="Уведомления" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
        <span id="bell-count" class="bell-count" hidden></span>
      </button>
      <div id="bell-panel" class="bell-panel" hidden></div>
    </div>
    <button type="button" id="theme" class="theme">
      <svg class="sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4l1.4-1.4M17 7l1.4-1.4"/></svg>
      <svg class="moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </button>
    <button type="button" id="lang" class="lang">EN</button>
    <div id="me-wrap" class="bell-wrap">
      <a id="avatar" class="avatar" href="#account" aria-expanded="false" data-t-label="Аккаунт" aria-label="Аккаунт">Я</a>
      <div id="me-menu" class="pop me-menu" role="menu" hidden></div>
    </div>
  </div>
</header>
<div id="ban-bar" class="ban-bar" role="status" hidden></div>

<div class="shell">
  <nav class="rail" data-t-label="Навигация" aria-label="Навигация">
    <a href="#apps" data-route="apps">
      <span class="rail-ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><ellipse cx="7.5" cy="8" rx="3.2" ry="4"/><ellipse cx="16.5" cy="8" rx="3.2" ry="4"/><ellipse cx="7.5" cy="17" rx="3.2" ry="4"/><ellipse cx="16.5" cy="17" rx="3.2" ry="4"/></svg></span><span data-t="Приложения">Приложения</span>
    </a>
    <a href="#feed" data-route="feed">
      <span class="rail-ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6h-6v6H4z" stroke-linejoin="round"/></svg></span><span data-t="Лента">Лента</span>
    </a>
    <a href="#chat" data-route="inbox" id="rail-inbox" hidden>
      <span class="rail-ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 8l9 6 9-6"/></svg><span id="inbox-count" class="rail-count" hidden></span></span><span data-t="Сообщения">Сообщения</span>
    </a>
    <a href="#account" data-route="account" id="rail-profile">
      <span class="rail-ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 4-7 8-7s7 2 8 7"/></svg></span><span data-t="Профиль">Профиль</span>
    </a>
    <div class="rail-bottom">
      <div class="rail-admin" id="rail-admin-group" hidden>
        <a href="#stats" data-route="stats" id="rail-stats">
          <span class="rail-ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg></span><span data-t="Статистика">Статистика</span>
        </a>
        <a href="#admin" data-route="admin" id="rail-admin">
          <span class="rail-ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.2 7.8-8 9-4.8-1.2-8-4.5-8-9V6z" stroke-linejoin="round"/><path d="M8.5 12l2.5 2.5 4.5-5" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="admin-count" class="rail-count" hidden></span></span><span data-t="Админка">Админка</span>
        </a>
      </div>
      <a href="#report" data-route="report" title="Сообщить о баге или идее" data-t-label="Сообщить о баге или идее" aria-label="Сообщить о баге или идее">
        <span class="rail-ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><path d="M12 8v3M12 13.5v.5"/></svg></span><span data-t="Сообщить">Сообщить</span>
      </a>
    </div>
  </nav>
  <main id="view" class="content" tabindex="-1"></main>
</div>

<div id="toast" class="toast" role="status" hidden></div>
<div id="cookie" class="cookie" role="region" data-t-label="Куки" aria-label="Куки" hidden>
  <p><span data-t="Мы храним в браузере вход и настройки: без этого сайт не работает. Рекламы и слежки нет.">Мы храним в браузере вход и настройки: без этого сайт не работает. Рекламы и слежки нет.</span> <a class="link" href="#terms" data-t="Подробнее">Подробнее</a></p>
  <button type="button" id="cookie-ok" class="btn" data-t="Понятно">Понятно</button>
</div>
<script type="module" src="app.js?v=93"></script>
</body>
</html>
