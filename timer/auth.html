<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Яйцетаймер</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #191919; color: #eee; font: 16px system-ui, -apple-system, sans-serif; }
  p { max-width: 360px; text-align: center; line-height: 1.5; padding: 0 20px; }
</style>
</head>
<body>
<p id="m">…</p>
<script>
// The Яйца Cloud site signed in with Google and sent the session here in the #fragment (it never
// leaves the browser). It goes to the Яйцетаймер tab that asked for it, then this tab closes.
(() => {
  const q = new URLSearchParams(location.hash.slice(1));
  history.replaceState(null, '', location.pathname);
  const state = q.get('state') || '', rt = q.get('rt') || '';
  const ok = /^[0-9a-f]{16,64}$/.test(state) && rt;
  const ru = (navigator.language || '').startsWith('ru');
  if (ok) {
    const v = { state, rt };
    try { new BroadcastChannel('yaytsa-auth').postMessage(v); } catch (e) {}
    try { localStorage.setItem('yaytsa-auth', JSON.stringify(v)); setTimeout(() => localStorage.removeItem('yaytsa-auth'), 5000); } catch (e) {}
  }
  document.getElementById('m').textContent = ok
    ? (ru ? 'Готово. Яйцетаймер подключён, эту вкладку можно закрыть.' : 'Done. Яйцетаймер is connected, you can close this tab.')
    : (ru ? 'Ссылка устарела. Нажмите «Войти через Google» в Яйцетаймере ещё раз.' : 'This link has expired. Press “Sign in with Google” in Яйцетаймер again.');
  if (ok) setTimeout(() => window.close(), 1200);
})();
</script>
</body>
</html>
