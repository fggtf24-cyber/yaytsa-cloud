  <main>
    <!-- TIMER -->
    <section class="view active" id="view-timer">
      <div class="face" id="face">
        <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
          <defs>
            <linearGradient id="ringWork" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3d8bff"/><stop offset="1" stop-color="#8a5cff"/></linearGradient>
            <linearGradient id="ringBreak" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2fbf8f"/><stop offset="1" stop-color="#3db7d6"/></linearGradient>
          </defs>
          <circle class="ring-track" cx="50" cy="50" r="46"/>
          <circle class="ring-fill" id="ringFill" cx="50" cy="50" r="46"/>
        </svg>
        <div class="phase-row">
          <span class="tag" id="phaseTag"></span>
          <span class="muted" id="cycleInfo"></span>
        </div>

        <div class="time" id="time">25:00</div>
        <div class="bar"><div class="bar-fill" id="barFill"></div></div>
        <div class="face-today" id="faceToday" data-android></div>
      </div>

      <div class="controls">
        <div class="c-side l">
          <button class="icon-btn" id="btnReset" data-i18n-title="stop">
            <svg viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2.6" fill="currentColor"/></svg>
          </button>
        </div>
        <button class="primary" id="btnStart"></button>
        <div class="c-side r">
          <button class="icon-btn" id="btnSkip" data-i18n-title="skip">
            <svg viewBox="0 0 24 24"><path d="M6 5.2v13.6a.8.8 0 0 0 1.25.66l9.9-6.8a.8.8 0 0 0 0-1.32l-9.9-6.8A.8.8 0 0 0 6 5.2z" fill="currentColor"/><path d="M19 5v14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>

      <!-- simple mode: the day at a glance — today's time towards the goal, and the streak -->
      <div class="simple-day" id="simpleDay">
        <div class="sd-top"><span class="sd-done" id="sdDone"></span><span class="sd-streak" id="sdStreak"></span></div>
        <div class="sd-bar"><i id="sdFill"></i></div>
      </div>

      <div class="label-wrap" data-c="label">
        <input class="label-input" id="label" maxlength="120" data-i18n-ph="labelPh" autocomplete="off" spellcheck="false">
        <button class="label-chev" id="labelChev" type="button" tabindex="-1" data-i18n-title="pickProj"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg></button>
        <div class="suggest" id="labelSuggest" hidden></div>
      </div>
      <div class="label-meta" id="labelMeta" data-c="meta"></div>

      <div class="dials" data-android>
        <div class="dial" data-key="work">
          <span class="dial-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="7.5" width="17" height="12" rx="2.6"/><path d="M9 7.5V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v1.5M3.5 12.5h17M12 11.5v2"/></svg></span>
          <div class="wheel"><div class="wheel-col"></div></div>
          <span class="dial-unit"></span>
        </div>
        <div class="dial" data-key="brk">
          <span class="dial-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9h11v4.5A4.5 4.5 0 0 1 11.5 18h-2A4.5 4.5 0 0 1 5 13.5z"/><path d="M16 10.5h1.2a2.2 2.2 0 0 1 0 4.4H16M8.5 4v2.5M12 4v2.5"/></svg></span>
          <div class="wheel"><div class="wheel-col"></div></div>
          <span class="dial-unit"></span>
        </div>
      </div>

      <div class="props">
        <div class="prop" data-p="work">
          <div class="prop-key">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6.5" width="14" height="10" rx="2.2"/><path d="M7.5 6.5V5.3a1.6 1.6 0 0 1 1.6-1.6h1.8a1.6 1.6 0 0 1 1.6 1.6v1.2M3 10.5h14"/></svg>
            <span data-i18n="work"></span>
          </div>
          <div class="stepper" data-key="work"></div>
        </div>

  <div class="modal" id="seriesCard" hidden>
    <div class="modal-card sc-card">
      <div class="ad-head"><span class="sc-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11a7 7 0 0 1 12-4.9L19 8M19 4v4h-4M19 13a7 7 0 0 1-12 4.9L5 16M5 20v-4h4"/></svg></span><div class="sc-titles"><h3 id="scName"></h3><div class="sc-sub" id="scSub"></div></div><button class="when-x" id="scClose" aria-label="×"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></svg></button></div>
      <div class="ad-main"><b id="scTotal"></b><span id="scCount"></span></div>
      <button class="sc-task" id="scTask"></button>
      <div class="sc-list" id="scList"></div>
    </div>
  </div>
  <div class="modal" id="planPanel" hidden>
    <div class="modal-card plan-card">
      <div class="ad-head"><h3 data-i18n="tabPlan" data-info="planLead"></h3><button class="when-x" id="planClose" aria-label="×"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></svg></button></div>
      <div class="plan-box" id="planBox">
        <div class="plan-next" id="planNext"></div>
        <div class="plan-scroll"><div id="planList"></div></div>
        <button class="danger-btn safe plan-add" id="btnPlanAdd" data-i18n="planAdd"></button>
      </div>
    </div>
  </div>
  <div class="modal" id="planEdit" hidden>
    <form class="modal-card at-card pe-card" id="peForm" autocomplete="off">
      <h3 id="peTitle"></h3>
      <div class="at-row"><span class="at-l" data-i18n="peTimeL"></span><button type="button" class="pe-time" id="peTime"></button></div>
      <div class="pe-span" id="peSpan"></div>
      <div class="at-row"><span class="at-l" data-i18n="peRepeatL"></span>
        <div class="seg small" id="peRepeat"><button type="button" data-v="once" data-i18n="peOnce"></button><button type="button" data-v="daily" data-i18n="everyDay"></button><button type="button" data-v="days" data-i18n="peWeekly"></button></div></div>
      <div class="pe-days" id="peDaysRow"><div id="peDays"></div></div>
      <div class="at-row" id="peDateRow"><span class="at-l" data-i18n="atWhen"></span><button type="button" class="when-chip" id="peDate"><svg class="when-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M8.5 3v4M15.5 3v4"/></svg><span></span></button></div>
      <div class="at-row"><span class="at-l" data-i18n="seriesCountL"></span><div class="stepper at-step"><button type="button" data-step="count" data-d="-1">−</button><span class="val" id="peCount"></span><button type="button" data-step="count" data-d="1">+</button></div></div>
      <div class="at-row"><span class="at-l" data-i18n="work"></span><div class="stepper at-step"><button type="button" data-step="work" data-d="-1">−</button><span class="val" id="peWork"></span><button type="button" data-step="work" data-d="1">+</button></div></div>
      <div class="at-row" id="peBrkRow"><span class="at-l" data-i18n="break"></span><div class="stepper at-step"><button type="button" data-step="brk" data-d="-1">−</button><span class="val" id="peBrk"></span><button type="button" data-step="brk" data-d="1">+</button></div></div>
      <input class="text-input" id="peProject" maxlength="120" data-i18n-ph="atProjectPh">
      <div class="at-chips" id="peChips"></div>
      <div class="modal-btns"><button type="button" class="pe-del" id="peDelete" data-i18n="delete"></button><button type="button" class="ghost" id="peCancel" data-i18n="cancel"></button><button type="submit" class="danger-btn safe" id="peSave" data-i18n="planSave"></button></div>
    </form>
  </div>
  <div class="modal" id="appDetail" hidden>
    <div class="modal-card ad-card">
      <div class="ad-head"><span id="adIco"></span><h3 id="adName"></h3><button class="when-x" id="adClose" aria-label="×"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></svg></button></div>
      <div class="seg small" id="adRange"><button data-r="1" data-i18n="adToday"></button><button data-r="7" data-i18n="ad7"></button><button data-r="30" data-i18n="ad30"></button><button data-r="90" data-i18n="ad90"></button><button data-r="0" data-i18n="adAll"></button></div>
      <div class="ad-main"><b id="adActive"></b><span data-i18n="adActiveL"></span></div>
      <div class="ad-nums">
        <div><b id="adOpen"></b><span data-i18n="adOpenL"></span></div>
      </div>
      <div class="ad-chart lc" id="adChart"></div>
      <div class="ad-span" id="adSpan"></div>
      <button class="ad-untrack" id="adUntrack" data-desktop data-i18n="stopTrack"></button>
    </div>
  </div>
  <div class="sheet-wrap" id="timeSheet" hidden>
    <div class="sheet ts">
      <h3 data-i18n="seriesStart"></h3>
      <div class="ts-cols">
        <div class="ts-band"></div>
        <div class="ts-col" id="tsH"></div>
        <span class="ts-sep">:</span>
        <div class="ts-col" id="tsM"></div>
      </div>
      <button class="ts-extra" id="tsExtra" hidden></button>
      <div class="ts-btns"><button class="ghost" id="tsNow" data-i18n="seriesNow"></button><button class="danger-btn safe" id="tsOk" data-i18n="done"></button></div>
    </div>
  </div>
  <div class="sheet-wrap" id="sheet" hidden>
    <div class="sheet"><h3 id="sheetTitle"></h3><div id="sheetItems"></div><button class="sheet-cancel" id="sheetCancel" data-i18n="cancel"></button></div>
  </div>
  <div class="banner" id="syncBanner" hidden>
    <span class="banner-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18.5h9.5a4 4 0 0 0 .6-7.95A5.5 5.5 0 0 0 6.3 9.6 4.5 4.5 0 0 0 7 18.5z"/><path d="M4 4l16 16"/></svg></span>
    <span class="banner-text" id="syncBannerText"></span>
    <button class="banner-go" id="syncBannerGo"></button>
    <button class="banner-x" id="syncBannerX" aria-label="×"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></svg></button>
  </div>
  <div class="toast" id="toast"><span></span><button hidden></button></div>
  <div class="update" id="update" hidden><span></span><button></button></div>

  <script src="webapi.js"></script><script src="sync.js"></script>
  <script src="app.js"></script>
</body>
</html>
