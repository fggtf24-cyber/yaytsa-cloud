<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Яйца Суфлёр</title>
  <meta name="description" content="Суфлёр, который слушает вас и сам листает текст">
  <script>
    // theme before first paint, so there is no flash
    try { const t = JSON.parse(localStorage.getItem('sufler.settings') || '{}').theme; if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Inter:wght@400;500;600&family=PT+Serif:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css?v=1.5.0">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body>
  <main id="view"></main>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="app.js?v=1.5.0"></script>
</body>
</html>
